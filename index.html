<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <title>Rekod Hafazan UTQH</title>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="144x144" href="/assets/icons/kkq144.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/kkq192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/kkq512.png" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/dist/themes/light.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icons/kkq192.png" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace.js"></script>

  <style>
    body {
      font-family: var(--sl-font-sans);
      background-color: #f1f5f9;
      padding: 20px;
      color: #334155;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 25px; }

    .nav-kelas {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .penyelia {
      font-size: 0.75rem;
      color: #475467;
      margin: 0 auto 12px;
      text-transform: none;
      letter-spacing: 0.02em;
    }

    .murid-card {
      margin-bottom: 15px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      padding: 20px;
      border: 1px solid #e2e8f0;
    }

    .nama-murid {
      font-weight: 700;
      display: block;
      margin-bottom: 12px;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #1e293b;
      border-left: 4px solid var(--sl-color-primary-500);
      padding-left: 10px;
    }

    .surah-container {
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .surah-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    sl-progress-bar {
      flex-grow: 1;
      --height: 12px;
      --track-color: #e2e8f0;
    }

    .peratus-teks {
      font-weight: 700;
      min-width: 40px;
      text-align: right;
      color: var(--sl-color-primary-600);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="container">
      <div class="header">
        <h2 class="judul-header">REKOD HAFAZAN KELAS KEMAHIRAN AL-QURAN 2026</h2>
        <p class="penyelia">Nama Guru: Ust Muhammad Ashraf bin Kamarul zaman</p>
        <sl-badge variant="success" pill id="badgeKelas">KELAS 1AF</sl-badge>
      </div>

      <div class="nav-kelas" role="tablist" aria-label="Pilih kelas">
        <sl-button size="small" variant="primary" data-kelas="1AF" pill role="tab" aria-selected="true">1AF</sl-button>
        <sl-button size="small" data-kelas="2AF" pill role="tab" aria-selected="false">2AF</sl-button>
        <sl-button size="small" data-kelas="3AF" pill role="tab" aria-selected="false">3AF</sl-button>
      </div>

      <div id="senaraiHafazan">
        <div class="loading-state">
          <sl-spinner class="loading-spinner"></sl-spinner>
          <p class="loading-text">Menarik data dari Google Sheets...</p>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
