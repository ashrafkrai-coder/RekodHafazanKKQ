<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Hafazan al-Farabi</title>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="144x144" href="/assets/icons/kkq144.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/kkq192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/kkq512.png" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/dist/themes/light.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="/assets/icons/kkq192.png" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace.js"></script>
</head>

<body>
  <div id="app">
    <div class="container">
      <div class="header">
        <h2 style="color: var(--sl-color-primary-600); margin-bottom: 8px;">REKOD HAFAZAN KELAS KEMAHIRAN AL-QURAN 2026</h2>
        <p class="penyelia">Nama Guru: Ust Muhammad Ashraf bin Kamarul zaman</p>
        <sl-badge variant="success" pill id="badgeKelas">KELAS 1AF</sl-badge>
      </div>

      <div class="nav-kelas" role="tablist" aria-label="Pilih kelas">
        <sl-button size="small" variant="primary" data-kelas="1AF" pill role="tab" aria-selected="true">1AF</sl-button>
        <sl-button size="small" data-kelas="2AF" pill role="tab" aria-selected="false">2AF</sl-button>
        <sl-button size="small" data-kelas="3AF" pill role="tab" aria-selected="false">3AF</sl-button>
      </div>

      <div id="senaraiHafazan">
        <div style="text-align:center; padding: 50px;">
          <sl-spinner style="font-size: 2rem;"></sl-spinner>
          <p style="color: #64748b; margin-top: 10px;">Menarik data dari Google Sheets...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
